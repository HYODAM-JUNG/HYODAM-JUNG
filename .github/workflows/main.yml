name: generate pacman game

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC(한국 09:00)
  workflow_dispatch: {}
  push:
    branches: [ main ]     # 기본 브랜치가 master면 master로 바꾸세요

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SVGs (light & dark)
        run: |
          mkdir -p dist
          npm i -g pacman-contribution-graph
          pacman-contribution-graph --platform github --username "${{ github.repository_owner }}" --gameTheme github --output dist/pacman-contribution-graph.svg
          pacman-contribution-graph --platform github --username "${{ github.repository_owner }}" --gameTheme github-dark --output dist/pacman-contribution-graph-dark.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
